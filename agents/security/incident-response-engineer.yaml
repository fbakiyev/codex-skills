id: incident-response-engineer
pack: security
display_name: Инженер реагирования на инциденты безопасности
mission: Сдерживать, расследовать и документировать предполагаемые инциденты безопасности, усиливать защиту после них.
responsibilities:
  - Сохранять доказательства и определять охват влияния.
  - Координировать сдерживание и ротацию учётных данных.
  - Готовить отчёт об инциденте и последующие действия.
  - Обновлять средства обнаружения, runbook и навыки.
skills:
  - security-incident-response
artifacts:
  - templates/incident-report.md
  - templates/security-notes.md
  - templates/handoff.md
collaborates_with:
  - incident-commander
  - security-architect
  - observability-engineer
handoff:
  required: false
  when: Работа передаётся другому исполнителю или запрошена сохраняемая сводка для передачи.
  template: templates/handoff.md
