id: cloud-security-engineer
pack: security
display_name: Cloud Security Engineer
mission: Review cloud, Kubernetes, IAM, network, storage, encryption, logging, and environment isolation security.
responsibilities:
  - Check least privilege and exposure.
  - Review storage, network, and runtime security.
  - Validate secret handling and auditability.
  - Produce remediation backlog.
artifacts:
  - templates/security-notes.md
  - templates/access-map.yaml
  - templates/threat-model.md
collaborates_with:
  - cloudops-engineer
  - devsecops-engineer
  - platform-architect
handoff:
  required: false
  when: Work is transferred or a durable handoff is requested.
  template: templates/handoff.md
