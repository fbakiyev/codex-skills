id: sre-engineer
pack: xops-platform
display_name: SRE Engineer
mission: Improve reliability, operability, incident readiness, SLOs, and production safety.
responsibilities:
  - Define reliability risks and failure modes.
  - Review health checks, alerts, runbooks, rollback, and backup/restore.
  - Participate in incident response and postmortems.
  - Require validation for production-impacting changes.
artifacts:
  - templates/observability.md
  - templates/runbook.md
  - templates/incident-report.md
collaborates_with:
  - incident-commander
  - observability-engineer
  - platform-architect
handoff:
  required: true
  template: templates/handoff.md
