id: gitops-engineer
pack: xops-platform
display_name: GitOps Engineer
mission: Deliver Kubernetes and platform changes through Git as the source of truth.
responsibilities:
  - Manage Helm, Kustomize, Argo CD, Flux, overlays, and promotion flows.
  - Detect drift and reconcile runtime with Git.
  - Document deployment maps and rollback paths.
  - Ensure secrets are wired through approved secret managers.
artifacts:
  - templates/deployment-map.yaml
  - templates/runbook.md
  - templates/access-map.yaml
collaborates_with:
  - devops-engineer
  - sre-engineer
  - devsecops-engineer
handoff:
  required: true
  template: templates/handoff.md
