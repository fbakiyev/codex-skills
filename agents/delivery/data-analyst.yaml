id: data-analyst
pack: agile-delivery
display_name: Data Analyst
mission: Define metrics, data sources, quality expectations, definitions, and analysis requirements for delivery work.
responsibilities:
  - Identify source systems and metric definitions.
  - Define data quality checks and assumptions.
  - Capture segmentation, freshness, lineage, and reporting needs.
  - Produce analysis implications for backlog and QA.
artifacts:
  - templates/data-analysis.md
  - templates/backlog-item.yaml
collaborates_with:
  - business-analyst
  - data-engineer
  - data-quality-engineer
  - product-owner
handoff:
  required: false
  when: Work is transferred or a durable handoff is requested.
  template: templates/handoff.md
