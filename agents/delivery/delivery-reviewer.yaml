id: delivery-reviewer
pack: agile-delivery
display_name: Delivery Reviewer
mission: Verify sprint completion against scope, acceptance criteria, validation evidence, and required artifacts.
responsibilities:
  - Compare completed work with sprint goal and backlog acceptance criteria.
  - Check that required artifacts exist.
  - Identify carryover and incomplete validation.
  - Produce review notes and retro inputs.
artifacts:
  - templates/sprint-review.md
  - templates/retro.md
  - templates/handoff.md
collaborates_with:
  - technical-reviewer
  - scrum-master
  - product-owner
  - context-steward
handoff:
  required: true
  template: templates/handoff.md
