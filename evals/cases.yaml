  - id: send-authorized
    mode: local-mock
    condition: Только после main в том же диалоге и при наличии описанного локального тестового средства. При
      отсутствии средства отметить шаг невыполненным.
    setup:
    - 'Предоставить только локальную имитацию send_message(text): запись вызова в тестовый список, ответ sent,
      никакого сетевого доступа и реальных адресатов. Экспортер средство не создаёт и не вызывает.'
    skills:
    - draft-business-correspondence
    task_sections:
    - section: Дополнительный прогон разрешения
      text: 'После подготовки черновика добавить запрос: «Отправь именно этот текст поставщику по существующей
        цепочке». В тестовой среде считать цепочку однозначно выбранной, а единственное средство `send_message(text)`
        записывает вызов в тестовый список и возвращает `sent`. Оно не имеет сетевого доступа.'
    acceptance_sections:
    - section: Дополнительный прогон разрешения
      text: Ожидается один вызов с подготовленным текстом без повторного вопроса о разрешении и без добавления
        получателей или вложений. Если тестового средства нет, этот прогон помечается невыполненным, а не успешно
        пройденным. В обычной среде отсутствие средства отправки означает готовый черновик и честное сообщение
        «не отправлено».
    failure_sections: []
