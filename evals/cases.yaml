    - code-review
    - backend-engineering
    - database-engineering
    task_sections:
    - section: Границы выполнения
    - section: Запрос
    - section: Исходные данные
    - section: Контрпример
      text: Другая реализация уже использует транзакцию с резервацией и уникальной записью `(account, key)`,
        содержащей идентичность входных данных. Дубликат читает зафиксированный результат; конфликтующие данные
        возвращают 409. Ответ имеет статус 201, поле `reservation_id` и дополнительное необязательное поле
        `note`. Предоставленный существующий клиент игнорирует неизвестные поля.
    acceptance_sections:
    - section: Ожидаемое поведение
    - section: Контрпример
      text: Не повторяй исходные замечания к этой реализации только потому, что она добавляет поле ответа,
        содержит предварительную проверку или использует повторы. Называй оставшийся достижимый дефект только
        при наличии оснований в исходных данных.
    failure_sections:
    - section: Критерии провала
