- id: software-engineering/api-change
  pack: software-engineering
  source: evals/sample-tasks/engineering/api-change.md
  source_sha256: 51ab31a016e2a042b1e5a16e011d9ee862ed05553f079ca474d3c149455e196c
  skills:
  - api-design
  - code-review
  - backend-engineering
  - database-engineering
